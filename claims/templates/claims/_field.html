<div class="field{% if field.errors %} bad{% endif %}{% if field.field.widget.input_type == 'checkbox' %} inline{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="err">{{ error }}</p>{% endfor %}
</div>
