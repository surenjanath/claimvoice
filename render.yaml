# One-click deploy. Render prompts only for ASSEMBLYAI_API_KEY; everything else
# is generated or derived.
#
# Note on the free plan: preDeployCommand is a paid feature, so migrations and
# seeding run in the build command instead. That runs on every deploy and has
# the database env vars, which is what matters. Publishing the agent is left to
# the /settings/ page, because the service's own hostname is only knowable at
# runtime.
databases:
  - name: claimvoice-db
    plan: free
    databaseName: claimvoice
    user: claimvoice

services:
  - type: web
    name: claimvoice
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_policies
    startCommand: gunicorn claimvoice.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: claimvoice-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Only the agent should be able to file a claim, so the webhooks require
      # this header and the published tools carry it.
      - key: CLAIM_WEBHOOK_SECRET
        generateValue: true
